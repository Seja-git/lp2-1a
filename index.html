<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ecommerce Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h3>🛒 Admin</h3>
  <a href="#"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a href="#"><i class="bi bi-bag"></i> Orders</a>
  <a href="#"><i class="bi bi-box"></i> Products</a>
  <a href="#"><i class="bi bi-people"></i> Customers</a>
  <a href="#"><i class="bi bi-graph-up"></i> Reports</a>
  <a href="#"><i class="bi bi-gear"></i> Settings</a>
</div>

<!-- Main Content -->
<div class="main">
  <h2 class="mb-4">Dashboard Overview</h2>

  <div class="row g-4">

    <div class="col-md-6 col-lg-3">
      <div class="card bg1 p-3">
        <h6>Total Sales</h6>
        <h3>₹1,20,000</h3>
        <i class="bi bi-currency-rupee fs-1"></i>
      </div>
    </div>

    <div class="col-md-6 col-lg-3">
      <div class="card bg2 p-3">
        <h6>Orders</h6>
        <h3>320</h3>
        <i class="bi bi-cart fs-1"></i>
      </div>
    </div>

    <div class="col-md-6 col-lg-3">
      <div class="card bg3 p-3">
        <h6>Products</h6>
        <h3>150</h3>
        <i class="bi bi-box-seam fs-1"></i>
      </div>
    </div>

    <div class="col-md-6 col-lg-3">
      <div class="card bg4 p-3">
        <h6>Customers</h6>
        <h3>89</h3>
        <i class="bi bi-people fs-1"></i>
      </div>
    </div>

  </div>

  <!-- Table -->
  <div class="mt-5">
    <h4>Recent Orders</h4>
    <div class="table-responsive">
      <table class="table table-striped mt-3">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Customer</th>
            <th>Product</th>
            <th>Status</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>Shoes</td>
            <td><span class="badge bg-success">Delivered</span></td>
            <td>₹2000</td>
          </tr>
          <tr>
            <td>2</td>
            <td>Anita</td>
            <td>Watch</td>
            <td><span class="badge bg-warning">Pending</span></td>
            <td>₹3500</td>
          </tr>
          <tr>
            <td>3</td>
            <td>Vikram</td>
            <td>Bag</td>
            <td><span class="badge bg-danger">Cancelled</span></td>
            <td>₹1500</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
